<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="browserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="url(#browserGrad)"/>

  <!-- Browser Window Outer Shell -->
  <rect x="8" y="11" width="48" height="42" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" filter="url(#shadow)"/>

  <!-- Top Titlebar / Window Header -->
  <path d="M8 17 C8 13.686 10.686 11 14 11 L50 11 C53.314 11 56 13.686 56 17 L56 22 L8 22 Z" fill="#1e293b"/>
  <line x1="8" y1="22" x2="56" y2="22" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="13" cy="16.5" r="2" fill="#ef4444"/>
  <circle cx="18" cy="16.5" r="2" fill="#f59e0b"/>
  <circle cx="23" cy="16.5" r="2" fill="#10b981"/>

  <!-- Address Bar Pill -->
  <rect x="28" y="14" width="23" height="5" rx="2.5" fill="#334155"/>
  <line x1="32" y1="16.5" x2="44" y2="16.5" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Content Area: Globe / Web Icon -->
  <circle cx="32" cy="37" r="10" stroke="#38bdf8" stroke-width="1.8" fill="none" opacity="0.95"/>
  <!-- Latitude line -->
  <line x1="22" y1="37" x2="42" y2="37" stroke="#38bdf8" stroke-width="1.4" opacity="0.8"/>
  <!-- Longitude ellipse -->
  <ellipse cx="32" cy="37" rx="5" ry="10" stroke="#38bdf8" stroke-width="1.4" fill="none" opacity="0.8"/>
  <ellipse cx="32" cy="37" rx="9" ry="4" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" fill="none" opacity="0.5"/>
</svg>
